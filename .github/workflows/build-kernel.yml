name: Build Droidspaces Kernel
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build kernel
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make gcc-aarch64-linux-gnu
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out mido_defconfig
          make O=out -j$(nproc)
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: out/arch/arm64/boot/Image.gz-dtb
